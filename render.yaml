services:
  # PromptOS Backend API
  - type: web
    name: promptos-backend
    runtime: python
    plan: free  # Change to 'starter' or higher for production
    region: oregon  # Choose closest to your users
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: promptos-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # Set manually in Render dashboard
      - key: OLLAMA_BASE_URL
        sync: false  # Set manually in Render dashboard

# PostgreSQL Database
databases:
  - name: promptos-db
    plan: free  # Change to 'starter' or higher for production
    databaseName: promptos
    user: promptos
    region: oregon  # Should match web service region
